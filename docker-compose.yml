# Whole stack with one command:  docker compose up --build
#   web  http://localhost:3000   (Next.js menu page)
#   api  http://localhost:3001   (NestJS, Swagger at /docs)
#   db   localhost:5432          (Postgres, user/password kiosk/kiosk)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: kiosk
      POSTGRES_DB: kiosk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once on first start: creates the separate test database (kiosk_test)
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk -d kiosk"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      # Inside Docker, services reach each other by service name ("db"), not localhost
      DATABASE_URL: postgresql://kiosk:kiosk@db:5432/kiosk?schema=public
      TEST_DATABASE_URL: postgresql://kiosk:kiosk@db:5432/kiosk_test?schema=public&connection_limit=20
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/menu').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build: ./web
    environment:
      API_URL: http://api:3001 # server-side only; the browser never calls the API
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy # wait until the API answers, so the first page load works

volumes:
  db-data:
